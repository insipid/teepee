<!DOCTYPE html>
<html>
  <head>
    <link rel="stylesheet" href="assets/teepee.css">
    <script src="assets/libv86.js"></script>

    <script src="assets/teepee.js"></script>
  </head>
  <body>
    <div id="screen">
      <canvas></canvas>
    </div>

    <button id="fullscreen">
      <img src="assets/teepee.svg">
    </button>

    <script>
     const params = new URLSearchParams(window.location.search);
     const image_tag = (params.has("demo") && "demo") ||
                       (params.has("edit") && "edit") ||
                       (params.has("play") && "play") ||
                       (params.has("run") && "run")   ||
                       "demo";

     const vm = new TeePee({
       fda: { url: "assets/images/teepee.img", async: false },
       fdb: { url: `assets/images/tag_${image_tag}.img`, async: false },
     });

     vm.add_listener("screen-set-size", vm.fitToViewport);
     window.addEventListener("resize", vm.fitToViewport);

     document.getElementById("fullscreen")
             .addEventListener("click", vm.fullscreen);
    </script>
  </body>
</html>
